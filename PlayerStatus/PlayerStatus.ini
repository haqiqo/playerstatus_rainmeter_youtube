; ============================================================
;  PlayerStatus - waveform + text, no lines, no clipping
;
;  Reads nowplaying.json (written by GetNowPlaying.ps1).
;  Works for WMP and browser tabs (YouTube Music, Spotify web)
;  via Windows' SMTC.
;
;  INSTALL: same as before - GetNowPlaying.ps1, RunHidden.vbs, and this
;  .ini all live in the same folder. Put RunHidden.vbs (not the .ps1)
;  in your Startup folder (Win+R -> shell:startup) so the data feed
;  runs invisibly at login - see RunHidden.vbs for details.
;  Then load this .ini in Rainmeter as usual.
; ============================================================

[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=PlayerStatus
Author=Qiqi
Version=3.0
Description=Waveform bars + regular-weight text, transparent background, no clipping

[Variables]
TitleColor=255,255,255,235
ArtistColor=255,255,255,150
WaveColor=255,255,255,200
BarCount=40
BarW=1
BarGap=3
BarMaxH=34

; ------------------------------------------------------------
; Read the JSON the PowerShell helper writes
; ------------------------------------------------------------
[MeasureNowPlaying]
Measure=WebParser
Url=file://#CURRENTPATH#nowplaying.json
RegExp=(?siU)"Title":"(.*)","Artist":"(.*)","App":"(.*)","State":(.*)\}
UpdateRate=1

[MeasureTitle]
Measure=WebParser
Url=[MeasureNowPlaying]
StringIndex=1

[MeasureArtist]
Measure=WebParser
Url=[MeasureNowPlaying]
StringIndex=2

[MeasureApp]
Measure=WebParser
Url=[MeasureNowPlaying]
StringIndex=3

[MeasureState]
Measure=WebParser
Url=[MeasureNowPlaying]
StringIndex=4

; ------------------------------------------------------------
; Live waveform (real system audio, via AudioLevel plugin)
; ------------------------------------------------------------
[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTAttack=25
FFTDecay=220
Bands=#BarCount#
FreqMin=60
FreqMax=14000
Sensitivity=32

