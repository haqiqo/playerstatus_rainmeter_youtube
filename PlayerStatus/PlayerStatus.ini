; ------------------------------------------------------------
; Text - regular weight, no lines, no width limit / clipping
; ------------------------------------------------------------
[MeterTitle]
Meter=String
MeasureName=MeasureTitle
X=0
Y=46
H=32
FontFace=Segoe UI Light
FontSize=17
FontColor=#TitleColor#
StringStyle=Normal
StringAlign=Left
AntiAlias=1
NoClip=1
Text="%1"

[MeterArtist]
Meter=String
MeasureName=MeasureArtist
X=0
Y=90
H=24
FontFace=Segoe UI Light
FontSize=12
FontColor=#ArtistColor#
StringStyle=Normal
StringAlign=Left
AntiAlias=1
NoClip=1
Text="%1"

; Invisible spacer - guarantees the skin's canvas extends past the
; artist text even though NoClip means the meter above doesn't
; itself define the true bottom edge.
[MeterBottomPad]
Meter=Shape
Shape=Rectangle 0,124,1,1
Hidden=1

; Double-click forces a refresh
[MeterClickArea]
Meter=Shape
Shape=Rectangle 0,0,1,1
W=1
H=1
Hidden=1
LeftMouseDoubleClickAction=[!Refresh]
